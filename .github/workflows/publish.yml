# Monorepo publish with Changesets. See johnhenry/workflows' README
# ("main is the release branch", Flow B).
#
# PRs that change a published package include a changeset (`npm run changeset`).
# On every push to main this workflow either (a) opens/updates the "Version
# Packages" PR that applies the bumps, or (b) if that PR was just merged,
# publishes every package whose version is not on npm yet (`changeset publish`
# skips versions already on the registry, so re-runs and no-op pushes are safe)
# and, as a by-product, pushes a git tag + GitHub Release per published package.
name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write # version-bump commit, tags, GitHub Releases
  pull-requests: write # the "Version Packages" PR
  id-token: write # npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changesets diffs against the base branch

      - uses: actions/setup-node@v4
        with:
          node-version: "26" # must equal the root engines.node major
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Verify before publishing
        run: |
          npm run build
          npm run test
          npm run typecheck

      - name: Version PR or publish
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          title: "chore: version packages"
          commit: "chore: version packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
